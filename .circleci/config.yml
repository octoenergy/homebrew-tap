---
version: 2.1

parameters:
  tag:
    type: string
    default: ""

orbs:
  ktl-nexus: krakentech/ktl-nexus@10
  gh: circleci/github-cli@2.7.2

commands:
  setup:
    steps:
      - ktl-nexus/login
      - run:
          name: Create virtualenv
          command: |
            python -m venv ~/circleci/venv/
            echo "source ~/circleci/venv/bin/activate" >> $BASH_ENV
            echo "export UV_PROJECT_ENVIRONMENT=~/circleci/venv/" >> $BASH_ENV
      - run:
          name: Install uv
          command: pip install uv
      - ktl-nexus/configure_uv

jobs:
  test-formula-macos:
    executor:
      name: ktl-nexus/macos
      xcode_version: 16.4.0 # MacOS 15.3.2
    environment:
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: "1"
      COMMIT_HASH: <<pipeline.git.revision>>
    steps:
      - setup
      - checkout
      - run:
          name: Configure environment variables for Homebrew
          command: |
            # Configure uv for mutual authentication
            echo 'export HOMEBREW_SSL_CLIENT_CERT=$SSL_CLIENT_CERT' | tee -a $BASH_ENV
            echo 'export HOMEBREW_UV_DEFAULT_INDEX=$UV_DEFAULT_INDEX' | tee -a $BASH_ENV
            echo 'export HOMEBREW_UV_INDEX_NEXUS_USERNAME=$UV_INDEX_NEXUS_USERNAME' | tee -a $BASH_ENV
            echo 'export HOMEBREW_UV_INDEX_NEXUS_PASSWORD=$UV_INDEX_NEXUS_PASSWORD' | tee -a $BASH_ENV
            echo 'export HOMEBREW_UV_SYSTEM_CERTS=$UV_SYSTEM_CERTS' | tee -a $BASH_ENV
            # Parse uv.lock to ensure external Nexus url is used
            echo 'export HOMEBREW_CIRCLECI=$CIRCLECI' | tee -a $BASH_ENV
      - run:
          name: Update Homebrew
          # The image ships an old Homebrew without `post_install_steps`.
          command: |
            brew update
            brew --version
      - run:
          name: Install Formula
          # Homebrew 7.0.14 no longer installs formulae from a file path (even with
          # HOMEBREW_DEVELOPER), so install by name from the tap, with this checkout's
          # formula copied over the tapped one. Set HOMEBREW_DEVELOPER here only,
          # because it changes how `brew update` works.
          environment:
            HOMEBREW_DEVELOPER: "1"
          command: |
            brew tap octoenergy/tap
            brew trust --tap octoenergy/tap || true
            cp ./kraken-cli.rb "$(brew --repository octoenergy/tap)/kraken-cli.rb"
            brew install --overwrite --force --verbose --formula octoenergy/tap/kraken-cli
      - run:
          name: Smoke test
          command: |
            set -x
            which kraken
            kraken --version
            kraken gen-fernet-key

workflows:
  test-formula-macos:
    when: << pipeline.git.branch >> != ""
    jobs:
      - test-formula-macos:
          context: KTL_NEXUS
